name: llamacpp
servers:
  openai:
    protocol: http
    base-path: /v1

environment:
  # Add llama.cpp binaries and shared libraries.
  # The prebuilt upstream binaries use an $ORIGIN RUNPATH and the ggml dynamic
  # backend loader expects libggml-* backends beside the executables, hence
  # both live together in bin/.
  - PATH=$PATH:$SNAP_COMPONENTS/llamacpp/bin
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/llamacpp/bin
  # Add staged shared libraries
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/llamacpp/usr/lib/$ARCH_TRIPLET

components:
  - llamacpp
