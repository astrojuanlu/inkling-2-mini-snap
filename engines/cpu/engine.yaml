name: cpu
summary: CPU-optimized for workstations
vendor: Canonical Ltd
devices:
  anyof:
    - type: cpu
      architecture: amd64
    - type: cpu
      architecture: arm64

runtime: llamacpp

model:
  default: inkling-2-mini-iq4-nl
  options:
    - inkling-2-mini-iq4-nl

configurations:
  sleep-idle-seconds: 600
  min-context-size: 4096
  # Upper bound for the KV pool. llama.cpp --fit only auto-sizes arguments
  # that are unset (--fit-ctx is a minimum), so an explicit context size
  # keeps the 1M-context model from ballooning memory on large hosts
  # (observed: 40 GB peak RSS on a 54 GB host without a cap). Override
  # with: inkling-2-mini set max-context-size=...
  max-context-size: 32768
