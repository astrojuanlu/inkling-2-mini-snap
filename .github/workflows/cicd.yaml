# This workflow is used to build and publish the snap to the store on every push to main.
name: CICD

on:
  push:
    branches:
      - main

  workflow_dispatch: # manual trigger


# Keep one CICD run active at a time so publish/test/promote happen in order
concurrency:
  group: ${{ github.workflow }}
  queue: max

jobs:
  cicd:
    if: github.repository == 'astrojuanlu/inkling-2-mini-snap' # do not run on forks
    uses: canonical/inference-snaps-dev/.github/workflows/reuse-cicd.yaml@v2
    with:
      # GitHub-hosted runners: standard runners only have ~14 GB of disk,
      # not enough for the ~18 GB model download, split and packaging.
      # ubuntu-latest-m (free for public repositories) provides 150 GB SSD.
      # Re-add arm64 once a larger ARM64 runner label is confirmed available.
      build-runner: |
        [
          ["ubuntu-latest-m"]
        ]

      store-track: latest
      snap-name: inkling-2-mini
      smoke-test-engine: cpu
      smoke-test-features: openai_models, openai_chat_text
      # ubuntu-latest-l (8 vCPU, 32 GB RAM, 300 GB SSD) so the CPU smoke
      # test has room for the KV pool that llama.cpp sizes from available
      # memory (observed peak: 40 GB on a 54 GB host without a context cap).
      smoke-test-runner: |
        [
          ["ubuntu-latest-l"]
        ]
    secrets:
      store-credentials: ${{ secrets.STORE_LOGIN_MAIN }}
